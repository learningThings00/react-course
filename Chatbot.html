<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      .app-container {
        max-width: 650px;
        height: 100vh;
        margin: auto;

        display: flex;
        flex-direction: column;
      }

      .input-container {
        padding: 15px 10px;

        display: flex;
        gap: 10px;
      }

      .toggle-container {
        padding: 15px 10px;

        text-align: center;
      }

      .input-message {
        flex-grow: 1;
        font-size: 16px;
        padding: 12px 20px;
        border-width: 1px;
        border-radius: 10px;
      }

      .send-message {
        background-color: green;
        color: white;
        font-size: 16px;
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
      }

      .chat-message-user {
        display: flex;
        justify-content: end;
        align-items: start;
        gap: 10px;
        margin-bottom: 10px;
      }

      .chat-message-robot {
        display: flex;
        align-items: start;
        gap: 10px;
        margin-bottom: 10px;
      }

      .chat-message {
        background-color: rgb(238, 238, 238);
        font-size: 18px;
        padding: 12px 20px;
        border-radius: 10px;
        max-width: 50%;
      }

      .sender-profile {
        width: 45px;
      }

      .chat-message-container {
        flex-grow: 1;
        overflow: scroll;
        scrollbar-width: none;
        margin: 10px;
      }

      .toggle-button {
        color: green;
        text-decoration: underline;
        cursor: pointer;
      }

      .empty-conversation {
        text-align: center;
        font-size: 18px;
        color: gray;
        margin: 0;
      }

      .loading-image {
        width: 40px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput({ chatMessages, setChatMessages }) {
        const [inputText, setInputText] = React.useState('');

        const [isLoading, setIsLoading] = React.useState(false);

        function saveInputText(event) {
          setInputText(event.target.value);
        }

        async function sendMessage() {
          if (!inputText) {
            return;
          }

          if (isLoading) {
            return;
          }


          setChatMessages(prev => [...prev, {
              message: inputText,
              sender: 'user',
              id: crypto.randomUUID()
            }]);

          setIsLoading(true);

          setChatMessages(prev => [
            ...prev,
            {
              message: <img className="loading-image" src="images/loading-spinner.gif" />,
              sender: 'robot',
              id: 'temp1'
            }
          ]);

          setInputText('');

          try {
          const response = await Chatbot.getResponseAsync(inputText);

          setChatMessages( prev => [
            ...prev.filter(msg => msg.id !== 'temp1'),
            {
              message: response,
              sender: 'robot',
              id: crypto.randomUUID()
            }
          ]);
          } catch (error) {
            console.log(error);

            setChatMessages( prev => [
              ...prev.filter(msg => msg.id !== 'temp1'),
              {
                message: 'Something went wrong. Please try again.',
                sender: 'robot',
                id: crypto.randomUUID()
              }
            ]);
          } finally {
            setIsLoading(false);

          }
        }

        function keyDownMenu(event) {
          if (event.key === 'Enter') {
            sendMessage();
          }

          if (event.key === 'Escape') {
            setInputText('');
          }
        }

        return (
          // don't use dom directy in React.
          <div className='input-container'>
            <input
              placeholder='Send a message to Chatbot'
              size='30'
              onChange={saveInputText}
              onKeyDown={keyDownMenu}
              value={inputText}
              className='input-message'
            />
            <button onClick={sendMessage} className='send-message'>
              Send
            </button>
          </div>
        );
      }

      function ChatMessage({ message, sender }) {
        //const { message, sender } = props;

        /*
        if (sender === 'robot') {
          return (
            <div>
              <img src='images/robot.png' width='50' />
              {message}
            </div>
          );
        }
         */

        return (
          <div
            className={
              sender === 'user' ? 'chat-message-user' : 'chat-message-robot'
            }
          >
            {sender === 'robot' && (
              <img src='images/robot.png' className='sender-profile' />
            )}
            <div className='chat-message'>{message}</div>
            {sender === 'user' && (
              <img src='images/user.png' className='sender-profile' />
            )}
          </div>
        );
      }

      function ChatMessages({ chatMessages, inputPosition }) {
        function useAutoScroll(dependencies) {
          const chatMessageRef = React.useRef(null);

          React.useEffect(() => {
            const containerElem = chatMessageRef.current;
            if (containerElem) {
              containerElem.scrollTop = containerElem.scrollHeight;
            }
          }, dependencies);

          return chatMessageRef;
        }

        const chatMessageRef = useAutoScroll([chatMessages]);

        
        return (
          <div className='chat-message-container' ref={chatMessageRef}>

            {chatMessages.length > 0 ? (chatMessages.map((chatMessage) => {
              return (
                <ChatMessage
                  message={chatMessage.message}
                  sender={chatMessage.sender}
                  key={chatMessage.id}
                />
              );
            })) : <p className="empty-conversation"> Welcome to chatbot project! Send a message in textbox {inputPosition}</p>
            }
          </div>
        );
      }

      function Toggle({ inputPosition, setInputPosition }) {
        function toggleChat() {
          if (inputPosition === 'above') {
            setInputPosition('below');
          } else {
            setInputPosition('above');
          }
        }
        return (
          <div className='toggle-container'>
            <a className='toggle-button' onClick={toggleChat}>
              Move textbox to {inputPosition === 'above' ? 'bottom' : 'top'}
            </a>
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([]);
        // const [chatMessages, setChatMessages] = array;
        // const chatMessages = array[0];
        // const setChatMessages = array[1];

        const [inputPosition, setInputPosition] = React.useState('above');

        return (
          <div className='app-container'>
            {inputPosition === 'above' ? (
              <ChatInput
                chatMessages={chatMessages}
                setChatMessages={setChatMessages}
              />
            ) : (
              <Toggle
                inputPosition={inputPosition}
                setInputPosition={setInputPosition}
              />
            )}
            <ChatMessages chatMessages={chatMessages} inputPosition={inputPosition} />
            {inputPosition === 'below' ? (
              <ChatInput
                chatMessages={chatMessages}
                setChatMessages={setChatMessages}
              />
            ) : (
              <Toggle
                inputPosition={inputPosition}
                setInputPosition={setInputPosition}
              />
            )}
          </div>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
